<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple AI Web App</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; background: #f4f4f9; }
        textarea { width: 100%; height: 100px; padding: 10px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #ccc; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin-top: 20px; background: white; padding: 15px; border-radius: 4px; border: 1px solid #ddd; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h2>My Simple AI App</h2>
    <form method="POST">
        <textarea name="prompt" placeholder="Ask the AI something...">{{ user_prompt }}</textarea><br>
        <button type="submit">Ask AI</button>
    </form>

    {% if ai_response %}
        <div class="result">
            <strong>AI Response:</strong>
            <p>{{ ai_response }}</p>
        </div>
    {% endif %}
</body>
</html>
